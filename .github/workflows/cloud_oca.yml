name: Nubi OCA EUMETSAT

# Fase 3b delle nubi 3D: le proprieta' ottiche misurate (OCA MTG-FCI) sulle
# colonne del volume ICON-EU. Un lavoro leggero e separato dalla pipeline
# dei dati: il prodotto esce ogni 10 minuti, la pipeline gira 4 volte al
# giorno. Le credenziali EUMETSAT restano nei segreti del repository e lo
# script dice solo se ci sono, mai il loro valore.
on:
  workflow_dispatch:
    inputs:
      sonda:
        description: "Solo la struttura di un file, niente pubblicazione"
        type: boolean
        default: false

concurrency:
  group: cloud-oca
  cancel-in-progress: false

jobs:
  oca:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          sparse-checkout: scripts/cloud_oca.py
          sparse-checkout-cone-mode: false

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Dipendenze
        run: pip install --quiet numpy netCDF4 pyproj requests

      - name: Scarica ed elabora OCA
        env:
          EUMETSAT_CONSUMER_KEY: ${{ secrets.EUMETSAT_CONSUMER_KEY }}
          EUMETSAT_CONSUMER_SECRET: ${{ secrets.EUMETSAT_CONSUMER_SECRET }}
        run: |
          if [ "${{ inputs.sonda }}" = "true" ]; then
            python scripts/cloud_oca.py --probe
          else
            python scripts/cloud_oca.py --out oca_out --hours 3 --max-new 6 \
              --index-url "https://raw.githubusercontent.com/${{ github.repository }}/gh-pages/data_weather/cloud_oca/index.json"
          fi

      # Come la corsia rapida: un commit sopra gh-pages, mai forzato. Si
      # aggiungono gli istanti nuovi e si tolgono quelli usciti dalla finestra.
      - name: Pubblica su gh-pages
        if: inputs.sonda != true
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const cartella = 'oca_out', base = 'data_weather/cloud_oca/';
            if (!fs.existsSync(cartella + '/index.json')) { core.info('Niente da pubblicare.'); return; }
            const indice = JSON.parse(fs.readFileSync(cartella + '/index.json', 'utf8'));
            const tenere = new Set(indice.frames.map((f) => f.file).concat(['index.json']));
            const owner = context.repo.owner, repo = context.repo.repo;
            const voci = [];
            for (const nome of fs.readdirSync(cartella)) {
              const blob = await github.rest.git.createBlob({ owner, repo,
                content: fs.readFileSync(cartella + '/' + nome).toString('base64'), encoding: 'base64' });
              voci.push({ path: base + nome, mode: '100644', type: 'blob', sha: blob.data.sha });
            }
            const sotto = async (albero, nome) => {
              const v = albero.find((e) => e.path === nome && e.type === 'tree');
              return v ? (await github.rest.git.getTree({ owner, repo, tree_sha: v.sha })).data.tree : [];
            };
            for (let tentativo = 1; tentativo <= 3; tentativo += 1) {
              const ref = await github.rest.git.getRef({ owner, repo, ref: 'heads/gh-pages' });
              const padre = ref.data.object.sha;
              const commit = await github.rest.git.getCommit({ owner, repo, commit_sha: padre });
              const radice = (await github.rest.git.getTree({ owner, repo, tree_sha: commit.data.tree.sha })).data.tree;
              if (!radice.some((v) => v.path === 'data_weather')) {
                core.setFailed('gh-pages non contiene data_weather: serve un run completo.');
                return;
              }
              const esistenti = await sotto(await sotto(radice, 'data_weather'), 'cloud_oca');
              const via = esistenti.filter((e) => e.type === 'blob' && !tenere.has(e.path))
                .map((e) => ({ path: base + e.path, mode: '100644', type: 'blob', sha: null }));
              const albero = await github.rest.git.createTree({ owner, repo,
                base_tree: commit.data.tree.sha, tree: voci.concat(via) });
              if (albero.data.sha === commit.data.tree.sha) { core.info('Gia\' aggiornato.'); return; }
              const nuovo = await github.rest.git.createCommit({ owner, repo,
                message: 'Nubi OCA ' + indice.updated, tree: albero.data.sha, parents: [padre] });
              try {
                await github.rest.git.updateRef({ owner, repo, ref: 'heads/gh-pages', sha: nuovo.data.sha });
                core.info('OCA pubblicato: ' + indice.frames.length + ' istanti, ' + via.length + ' rimossi.');
                return;
              } catch (errore) {
                core.info('gh-pages e\' cambiata (tentativo ' + tentativo + '): ' + errore.message);
                await new Promise((r) => setTimeout(r, 4000));
              }
            }
            core.setFailed('Non sono riuscito ad aggiornare gh-pages.');
