name: Preserve Latest Meteo Frontend

# A scheduled data run can finish after a frontend fix and publish its older
# checkout. Reapply current static assets above the new data without forcing
# gh-pages or changing forecasts. This workflow does not trigger itself.
on:
  workflow_run:
    workflows: ['Update Meteo Data']
    types: [completed]
    branches: [main]

concurrency:
  group: meteo-frontend-sync
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  sync_frontend:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout latest frontend
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Prove dell'interfaccia
        run: |
          set -e
          for prova in scripts/tests/test_*.js; do
            node "$prova"
          done

      - name: Pubblica i file statici su gh-pages
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const percorsi = [
              'index.html', 'meteograms.html', 'radar.html',
              'point_bulletin.js', 'local_downscaling.js',
              'forecast-cache.js', 'modern-ui.js', 'modern-ui.css',
              'meteograms-ui.css'
            ];
            for (const nome of fs.readdirSync('data_base')) {
              percorsi.push('data_base/' + nome);
            }
            const owner = context.repo.owner, repo = context.repo.repo;

            // I blob si caricano una volta sola: non dipendono dal commit su
            // cui si innesta l'albero, quindi un eventuale nuovo tentativo
            // non li ricarica.
            const voci = [];
            for (const percorso of percorsi) {
              const blob = await github.rest.git.createBlob({ owner, repo,
                content: fs.readFileSync(percorso).toString('base64'),
                encoding: 'base64' });
              voci.push({ path: percorso, mode: '100644', type: 'blob', sha: blob.data.sha });
            }

            // Un run dei dati puo' aver forzato gh-pages mentre lavoravamo.
            // In quel caso il nostro genitore non e' piu' la punta e
            // updateRef rifiuta: si rilegge il ramo e si riprova, senza mai
            // forzare -- forzare qui vorrebbe dire cancellare i dati appena
            // pubblicati da quel run.
            for (let tentativo = 1; tentativo <= 3; tentativo += 1) {
              const ref = await github.rest.git.getRef({ owner, repo, ref: 'heads/gh-pages' });
              const padre = ref.data.object.sha;
              const commit = await github.rest.git.getCommit({ owner, repo, commit_sha: padre });

              // Guardia: si pubblica sopra i dati, mai al posto loro. Se il
              // ramo non porta data_weather, l'innesto darebbe un sito di
              // sola interfaccia senza previsioni.
              const radice = await github.rest.git.getTree({ owner, repo,
                tree_sha: commit.data.tree.sha });
              if (!radice.data.tree.some((v) => v.path === 'data_weather')) {
                core.setFailed('gh-pages non contiene data_weather: serve un run completo.');
                return;
              }

              const albero = await github.rest.git.createTree({ owner, repo,
                base_tree: commit.data.tree.sha, tree: voci });
              if (albero.data.sha === commit.data.tree.sha) {
                core.info('I file pubblicati sono gia\' identici: niente da fare.');
                return;
              }
              const nuovo = await github.rest.git.createCommit({ owner, repo,
                message: 'Aggiorna interfaccia ' + new Date().toISOString().replace(/\.\d{3}Z$/, 'Z'),
                tree: albero.data.sha, parents: [padre] });
              try {
                await github.rest.git.updateRef({ owner, repo, ref: 'heads/gh-pages',
                  sha: nuovo.data.sha });
                core.info('Interfaccia pubblicata su gh-pages (tentativo ' + tentativo + ').');
                return;
              } catch (errore) {
                core.info('gh-pages e\' cambiata sotto di noi (tentativo ' + tentativo
                  + '): ' + errore.message);
                await new Promise((r) => setTimeout(r, 4000));
              }
            }
            core.setFailed('Non sono riuscito ad aggiornare gh-pages: riprovare o lanciare un run completo.');

